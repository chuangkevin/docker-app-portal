# nas-918：/volume1/docker/portal/  →  sudo docker compose up -d --build
services:
  portal:
    build: .
    image: docker-app-portal:2
    container_name: portal
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - 100.96.225.31:1123:3000
    environment:
      DATABASE_PATH: /data/portal.db
      BESZEL_DB: /beszel/data.db
      CADDY_CONFIG_URL: https://portal.sisihome.org/__caddy/servers
      CADDY_HOST_IP: 100.127.82.47
      HOST_ALIASES: nb-l390.bunny-salmon.ts.net=100.79.199.43
    volumes:
      - ./data:/data
      # Beszel 的資料庫：機器清單與容器（程式只用唯讀方式開）
      - /volume1/docker/monitor/beszel_data:/beszel
